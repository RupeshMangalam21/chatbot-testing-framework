name: Chatbot Quality Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 02:00 UTC to detect chatbot drift over time
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, ui, conversation, safety, latency, regression, edge]

env:
  NODE_VERSION: '20'
  # Override in GitHub Secrets for real environments
  APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'http://localhost:3000' }}
  LLM_JUDGE_ENABLED: ${{ secrets.LLM_JUDGE_ENABLED || 'false' }}
  LLM_JUDGE_PROVIDER: ${{ secrets.LLM_JUDGE_PROVIDER || 'anthropic' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  chatbot-tests:
    name: Chatbot Quality Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false  # Don't cancel other suites if one fails
      matrix:
        suite:
          - ui
          - conversation
          - safety
          - edge
          - latency

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start Next.js application
        run: |
          cd ${{ github.workspace }}/..  # Navigate to the Next.js app root
          npm ci
          npm run build
          npm run start &
          # Wait for the app to be ready
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          NODE_ENV: test

      - name: Run chatbot tests — ${{ matrix.suite }}
        run: npx playwright test tests/${{ matrix.suite }}/
        env:
          APP_BASE_URL: ${{ env.APP_BASE_URL }}
          CI: 'true'

      - name: Generate quality report
        if: always()
        run: npm run chatbot:report

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 30

      - name: Upload chatbot quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbot-quality-report-${{ matrix.suite }}
          path: chatbot-reports/
          retention-days: 30

      - name: Upload test artifacts (screenshots, videos, traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.suite }}
          path: test-artifacts/
          retention-days: 7

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: chatbot-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all quality reports
        uses: actions/download-artifact@v4
        with:
          pattern: chatbot-quality-report-*
          path: chatbot-reports/
          merge-multiple: true

      - name: Check quality gates
        run: |
          npx ts-node scripts/check-quality-gates.ts
        env:
          CI: 'true'

      - name: Comment PR with quality summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('chatbot-reports').filter(f => f.endsWith('.json'));
            if (reports.length === 0) return;

            const report = JSON.parse(fs.readFileSync(`chatbot-reports/${reports[0]}`, 'utf-8'));
            const s = report.summary;

            const emoji = report.overallGrade === 'A' || report.overallGrade === 'B' ? '✅' : 
                          report.overallGrade === 'C' ? '⚠️' : '❌';

            const body = `## ${emoji} Chatbot Quality Report — Grade: ${report.overallGrade}

            | Metric | Value |
            |--------|-------|
            | Pass Rate | ${(s.passRate * 100).toFixed(1)}% |
            | Avg Relevance | ${s.avgRelevanceScore.toFixed(2)}/5 |
            | Avg Latency | ${s.avgLatencyMs.toFixed(0)}ms |
            | Safety Violations | ${s.safetyViolations} |
            | Hallucination Flags | ${s.hallucinationFlags} |

            ${s.safetyViolations > 0 ? '> ⛔ **SAFETY VIOLATIONS DETECTED** — immediate action required' : ''}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  safety-gate:
    name: Safety Gate (Zero Tolerance)
    runs-on: ubuntu-latest
    needs: chatbot-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download safety test report
        uses: actions/download-artifact@v4
        with:
          name: chatbot-quality-report-safety
          path: chatbot-reports/safety/

      - name: Enforce zero safety violations
        run: |
          npx ts-node -e "
            const fs = require('fs');
            const files = fs.readdirSync('chatbot-reports/safety').filter(f => f.endsWith('.json'));
            if (files.length === 0) { console.log('No safety report found'); process.exit(1); }
            const report = JSON.parse(fs.readFileSync('chatbot-reports/safety/' + files[0], 'utf-8'));
            if (report.summary && report.summary.safetyViolations > 0) {
              console.error('FATAL: ' + report.summary.safetyViolations + ' safety violation(s) detected!');
              process.exit(1);
            }
            console.log('Safety gate passed: 0 violations');
          "
